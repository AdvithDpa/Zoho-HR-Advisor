<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoho Knowledge Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #60a5fa 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sidebar {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar-section {
            margin-bottom: 25px;
        }

        .sidebar-title {
            font-size: 0.85em;
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-btn {
            padding: 10px 12px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 8px;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #e2e8f0;
        }

        .category-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #60a5fa;
            color: #60a5fa;
            font-weight: 600;
        }

        .category-count {
            font-size: 0.75em;
            background: rgba(71, 85, 105, 0.5);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(71, 85, 105, 0.3);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #cbd5e1;
        }

        .stat-value {
            color: #60a5fa;
            font-weight: 600;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .add-note-section {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 20px;
        }

        .add-note-btn {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }

        .add-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .form-section {
            display: none;
        }

        .form-section.visible {
            display: block;
        }

        textarea {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #e2e8f0;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        textarea:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        select, input {
            padding: 10px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.95em;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .form-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95em;
        }

        .btn-save {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: rgba(71, 85, 105, 0.5);
            color: #cbd5e1;
        }

        .btn-cancel:hover {
            background: rgba(71, 85, 105, 0.7);
        }

        .search-section {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1em;
        }

        .notes-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s;
        }

        .note-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(30, 41, 59, 0.9);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .note-category {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .note-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .note-text {
            color: #e2e8f0;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .note-meta {
            display: flex;
            gap: 20px;
            font-size: 0.8em;
            color: #94a3b8;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .export-btn {
            width: 100%;
            padding: 8px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.85em;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(71, 85, 105, 0.3);
        }

        .export-btn:hover {
            background: rgba(34, 197, 94, 0.4);
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
            h1 {
                font-size: 1.8em;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 Zoho Knowledge Manager</h1>
            <p class="subtitle">Smart knowledge base - No API calls, works offline</p>
        </header>

        <div class="main-grid">
            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">📁 Categories</div>
                    <div class="category-list" id="categoryList"></div>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">📊 Stats</div>
                    <div class="stats">
                        <div class="stat-item">
                            <span>Total Notes</span>
                            <span class="stat-value" id="totalNotes">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Categories</span>
                            <span class="stat-value" id="totalCategories">0</span>
                        </div>
                    </div>
                </div>

                <button class="export-btn" onclick="exportToPDF()">📄 Export as PDF</button>
            </div>

            <div class="content">
                <div class="add-note-section">
                    <button class="add-note-btn" onclick="toggleForm()">+ Add New Note</button>

                    <div class="form-section" id="formSection">
                        <textarea id="noteText" placeholder="Type your pointer here..." oninput="checkDuplicates()"></textarea>

                        <div id="duplicateAlert"></div>

                        <div class="form-row">
                            <select id="noteCategory"></select>
                            <input type="text" id="noteTitle" placeholder="Note title (optional)">
                        </div>

                        <div class="form-buttons">
                            <button class="btn-save" onclick="saveNote()">Save Note</button>
                            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                        </div>
                    </div>
                </div>

                <div class="search-section">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search..." oninput="filterNotes()">
                </div>

                <div class="notes-container" id="notesContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_CATEGORIES = [
            'Automation', 'Integration', 'Reports', 'Workflows', 
            'Data Entry', 'Reconciliation', 'API', 'Best Practice', 'Troubleshooting'
        ];

        let notes = [];
        let categories = [];
        let currentFilter = 'All';
        let editingId = null;

        function init() {
            loadFromStorage();
            renderCategories();
            renderNotes();
            updateStats();
        }

        function loadFromStorage() {
            const stored = localStorage.getItem('zoho-kb');
            const storedCats = localStorage.getItem('zoho-cats');
            
            if (stored) notes = JSON.parse(stored);
            if (storedCats) categories = JSON.parse(storedCats);
            else {
                categories = [...DEFAULT_CATEGORIES];
                saveCategoriesToStorage();
            }
        }

        function saveToStorage() {
            localStorage.setItem('zoho-kb', JSON.stringify(notes));
        }

        function saveCategoriesToStorage() {
            localStorage.setItem('zoho-cats', JSON.stringify(categories));
        }

        function renderCategories() {
            const list = document.getElementById('categoryList');
            list.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'category-btn active';
            allBtn.onclick = () => filterByCategory('All');
            allBtn.innerHTML = `<span>All Notes</span><span class="category-count">${notes.length}</span>`;
            list.appendChild(allBtn);

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                const count = notes.filter(n => n.category === cat).length;
                btn.onclick = () => filterByCategory(cat);
                btn.innerHTML = `<span>${cat}</span><span class="category-count">${count}</span>`;
                list.appendChild(btn);
            });

            updateCategorySelect();
        }

        function updateCategorySelect() {
            const select = document.getElementById('noteCategory');
            select.innerHTML = '';
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        function filterByCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.category-btn').classList.add('active');
            if (cat !== 'All') {
                document.getElementById('noteCategory').value = cat;
            }
            filterNotes();
        }

        function calculateSimilarity(str1, str2) {
            const s1 = str1.toLowerCase().trim();
            const s2 = str2.toLowerCase().trim();
            if (s1 === s2) return 1;
            if (s1.length < 10 || s2.length < 10) return 0;
            
            const words1 = s1.split(/\s+/).filter(w => w.length > 2);
            const words2 = s2.split(/\s+/).filter(w => w.length > 2);
            
            if (words1.length === 0 || words2.length === 0) return 0;
            
            const set1 = new Set(words1);
            const set2 = new Set(words2);
            
            const matches = words1.filter(w => set2.has(w)).length;
            return matches / Math.max(words1.length, words2.length);
        }

        function checkDuplicates() {
            const text = document.getElementById('noteText').value.trim();
            const alert = document.getElementById('duplicateAlert');
            
            if (text.length < 20) {
                alert.innerHTML = '';
                return;
            }

            let similar = [];
            notes.forEach(note => {
                const sim = calculateSimilarity(text, note.text);
                if (sim >= 0.3) {
                    similar.push({ note, score: sim });
                }
            });

            similar.sort((a, b) => b.score - a.score);

            if (similar.length > 0) {
                let html = `<div style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); padding: 12px; margin-bottom: 12px; border-radius: 8px;">
                    <div style="color: #fca5a5; margin-bottom: 10px;">⚠️ Similar Notes Found! (${similar.length})</div>`;
                
                similar.forEach((item, idx) => {
                    html += `<div style="background: rgba(15,23,42,0.7); padding: 8px; margin-bottom: 8px; border-radius: 4px; font-size: 0.9em;">
                        <strong>${idx + 1}. ${Math.round(item.score * 100)}% Match</strong> (${item.note.category})<br>
                        "${item.note.text.substring(0, 80)}..."<br>
                        <button onclick="overwriteNote(${item.note.id})" style="margin-top: 4px; padding: 4px 8px; background: rgba(239,68,68,0.3); color: #fca5a5; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8em;">Overwrite</button>
                    </div>`;
                });

                html += `<button onclick="continueNew()" style="width: 100%; padding: 6px; margin-top: 8px; background: rgba(34,197,94,0.3); color: #86efac; border: none; border-radius: 4px; cursor: pointer;">Continue Saving New</button>
                </div>`;
                
                alert.innerHTML = html;
            } else {
                alert.innerHTML = `<div style="background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); padding: 12px; margin-bottom: 12px; border-radius: 8px; color: #86efac;">✓ Unique note!</div>`;
            }
        }

        function overwriteNote(id) {
            const text = improveGrammar(document.getElementById('noteText').value.trim());
            const note = notes.find(n => n.id === id);
            if (note) {
                note.text = text;
                note.title = document.getElementById('noteTitle').value || text.substring(0, 50) + '...';
                note.category = document.getElementById('noteCategory').value;
                note.updatedAt = new Date().toISOString();
            }
            saveToStorage();
            renderNotes();
            updateStats();
            renderCategories();
            cancelEdit();
            alert('✓ Note overwritten!');
        }

        function continueNew() {
            saveNote();
        }

        function improveGrammar(text) {
            let improved = text.trim();
            if (improved.length > 0) {
                improved = improved.charAt(0).toUpperCase() + improved.slice(1);
            }
            improved = improved
                .replace(/\s+([.,!?;:])/g, '$1')
                .replace(/([.,!?;:])([a-z])/g, '$1 $2')
                .replace(/\s+/g, ' ')
                .replace(/\bthis\s+/gi, 'This ');
            
            if (improved.length > 20 && !improved.match(/[.!?]$/)) {
                improved += '.';
            }
            return improved;
        }

        function toggleForm() {
            const form = document.getElementById('formSection');
            form.classList.toggle('visible');
            if (form.classList.contains('visible')) {
                document.getElementById('noteText').focus();
            } else {
                cancelEdit();
            }
        }

        function cancelEdit() {
            document.getElementById('noteText').value = '';
            document.getElementById('noteTitle').value = '';
            document.getElementById('duplicateAlert').innerHTML = '';
            document.getElementById('formSection').classList.remove('visible');
            editingId = null;
        }

        function saveNote() {
            const text = improveGrammar(document.getElementById('noteText').value.trim());
            const title = document.getElementById('noteTitle').value.trim();
            const category = document.getElementById('noteCategory').value;

            if (!text) {
                alert('Please enter note content');
                return;
            }

            if (editingId) {
                const note = notes.find(n => n.id === editingId);
                if (note) {
                    note.text = text;
                    note.title = title || text.substring(0, 50) + '...';
                    note.category = category;
                    note.updatedAt = new Date().toISOString();
                }
            } else {
                notes.unshift({
                    id: Date.now(),
                    title: title || text.substring(0, 50) + '...',
                    text: text,
                    category: category,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
            }

            saveToStorage();
            renderNotes();
            updateStats();
            renderCategories();
            cancelEdit();
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                editingId = id;
                document.getElementById('noteText').value = note.text;
                document.getElementById('noteTitle').value = note.title;
                document.getElementById('noteCategory').value = note.category;
                document.getElementById('formSection').classList.add('visible');
                document.getElementById('noteText').focus();
            }
        }

        function deleteNote(id) {
            if (confirm('Delete this note?')) {
                notes = notes.filter(n => n.id !== id);
                saveToStorage();
                renderNotes();
                updateStats();
                renderCategories();
            }
        }

        function renderNotes() {
            filterNotes();
        }

        function filterNotes() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = notes.filter(note => {
                const matchCat = currentFilter === 'All' || note.category === currentFilter;
                const matchSearch = note.text.toLowerCase().includes(search) || note.title.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            const container = document.getElementById('notesContainer');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>No notes found</h3></div>';
                return;
            }

            container.innerHTML = filtered.map(note => `
                <div class="note-card">
                    <div class="note-header">
                        <span class="note-category">${note.category}</span>
                        <div class="note-actions">
                            <button class="btn-small btn-edit" onclick="editNote(${note.id})">Edit</button>
                            <button class="btn-small btn-delete" onclick="deleteNote(${note.id})">Delete</button>
                        </div>
                    </div>
                    <div class="note-text">${note.text}</div>
                    <div class="note-meta">
                        <span>📝 ${note.title}</span>
                        <span>📅 ${new Date(note.createdAt).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalNotes').textContent = notes.length;
            document.getElementById('totalCategories').textContent = categories.length;
        }

        function exportToPDF() {
            const byCategory = {};
            categories.forEach(cat => {
                byCategory[cat] = notes.filter(n => n.category === cat);
            });

            let html = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zoho Knowledge Base</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; color: #333; }
        h1 { color: #0066cc; text-align: center; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
        h2 { color: #0066cc; background: #e6f0ff; padding: 10px; margin-top: 20px; border-left: 4px solid #0066cc; }
        .pointer { background: #f9f9f9; border: 1px solid #ddd; border-left: 4px solid #0066cc; padding: 12px; margin: 10px 0; }
        .meta { font-size: 12px; color: #999; margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
    </style>
</head>
<body>
    <h1>📚 Zoho Knowledge Base</h1>
    <p style="text-align: center; color: #666;">Exported: ${new Date().toLocaleString()}</p>
`;

            categories.forEach(cat => {
                const catNotes = byCategory[cat];
                html += `<h2>${cat} (${catNotes.length})</h2>`;
                if (catNotes.length === 0) {
                    html += '<p style="color: #999;">No notes</p>';
                } else {
                    catNotes.forEach((note, idx) => {
                        html += `<div class="pointer">
                            <strong>${idx + 1}.</strong> ${note.text}
                            <div class="meta">Title: ${note.title} | Date: ${new Date(note.createdAt).toLocaleDateString()}</div>
                        </div>`;
                    });
                }
            });

            html += '</body></html>';

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `zoho-knowledge-${new Date().toISOString().split('T')[0]}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('✓ Exported! You can open in browser and save as PDF using Ctrl+P (or Cmd+P on Mac)');
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
