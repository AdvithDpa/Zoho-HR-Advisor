<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoho Knowledge Manager - V4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #60a5fa 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sidebar {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar-section {
            margin-bottom: 25px;
        }

        .sidebar-title {
            font-size: 0.85em;
            font-weight: 600;
            color: #60a5fa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-btn {
            padding: 10px 12px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 8px;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #e2e8f0;
        }

        .category-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #60a5fa;
            color: #60a5fa;
            font-weight: 600;
        }

        .category-count {
            font-size: 0.75em;
            background: rgba(71, 85, 105, 0.5);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(71, 85, 105, 0.3);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #cbd5e1;
        }

        .stat-value {
            color: #60a5fa;
            font-weight: 600;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .add-note-section {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 20px;
        }

        .add-note-btn {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .form-section {
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .form-section.visible {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        textarea {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #e2e8f0;
            resize: vertical;
            min-height: 120px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.95em;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        select, input {
            padding: 10px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.95em;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .real-time-panel {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .real-time-panel.visible {
            display: block;
        }

        .real-time-status {
            font-size: 0.9em;
            margin-bottom: 8px;
            color: #60a5fa;
            font-weight: 600;
        }

        .similar-note-alert {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #fca5a5;
        }

        .old-note-preview {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(71, 85, 105, 0.3);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            margin-top: 8px;
        }

        .old-note-label {
            font-size: 0.8em;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .old-note-text {
            font-size: 0.85em;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .decision-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-overwrite {
            padding: 8px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-overwrite:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .btn-continue {
            padding: 8px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-continue:hover {
            background: rgba(34, 197, 94, 0.4);
        }

        .unique-note-alert {
            background: rgba(34, 197, 94, 0.1);
            border-left: 3px solid #22c55e;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #86efac;
        }

        .form-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95em;
        }

        .btn-save {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-cancel {
            background: rgba(71, 85, 105, 0.5);
            color: #cbd5e1;
        }

        .btn-cancel:hover {
            background: rgba(71, 85, 105, 0.7);
        }

        .search-section {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1em;
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .notes-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .note-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .note-category {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .note-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .note-card:hover .note-actions {
            opacity: 1;
        }

        .btn-small {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }

        .btn-edit {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .btn-edit:hover {
            background: rgba(59, 130, 246, 0.4);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .note-text {
            color: #e2e8f0;
            line-height: 1.6;
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        .note-meta {
            display: flex;
            gap: 20px;
            font-size: 0.8em;
            color: #94a3b8;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #94a3b8;
        }

        .add-category-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(71, 85, 105, 0.3);
        }

        .add-category-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 0.9em;
        }

        .add-category-btn {
            width: 100%;
            padding: 8px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.85em;
        }

        .add-category-btn:hover {
            background: rgba(59, 130, 246, 0.4);
        }

        .export-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(71, 85, 105, 0.3);
        }

        .export-btn {
            width: 100%;
            padding: 8px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.85em;
        }

        .export-btn:hover {
            background: rgba(34, 197, 94, 0.4);
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }

            h1 {
                font-size: 1.8em;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 Zoho Knowledge Manager - V4</h1>
            <p class="subtitle">Smart detection • Overwrite or Continue • No merging • Clean notes</p>
        </header>

        <div class="main-grid">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">📁 Categories</div>
                    <div class="category-list" id="categoryList"></div>
                </div>

                <div class="add-category-section">
                    <input 
                        type="text" 
                        id="newCategoryInput" 
                        class="add-category-input" 
                        placeholder="Add new category..."
                    >
                    <button class="add-category-btn" onclick="addNewCategory()">+ Add Category</button>
                </div>

                <div class="sidebar-section" style="margin-top: 25px;">
                    <div class="sidebar-title">📊 Stats</div>
                    <div class="stats">
                        <div class="stat-item">
                            <span>Total Notes</span>
                            <span class="stat-value" id="totalNotes">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Categories</span>
                            <span class="stat-value" id="totalCategories">0</span>
                        </div>
                    </div>
                </div>

                <div class="export-section">
                    <button class="export-btn" onclick="exportToPDF()">📄 Export as PDF</button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="content">
                <!-- Add Note Section -->
                <div class="add-note-section">
                    <button class="add-note-btn" id="addNoteBtn" onclick="toggleForm()">
                        + Add New Note
                    </button>

                    <div class="form-section" id="formSection">
                        <textarea 
                            id="noteText" 
                            placeholder="Paste your Zoho community note, article, or solution here..."
                            oninput="checkRealTimeDuplicates()"
                        ></textarea>

                        <!-- Real-time Detection Panel -->
                        <div class="real-time-panel" id="realtimePanel"></div>

                        <div class="form-row">
                            <select id="noteCategory">
                                <!-- Will be populated by JS -->
                            </select>
                            <input 
                                type="text" 
                                id="noteTitle" 
                                placeholder="Note title (optional)"
                            >
                        </div>

                        <div class="form-buttons">
                            <button class="btn-save" id="saveBtn" onclick="saveNote()">Save Note</button>
                            <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- Search Section -->
                <div class="search-section">
                    <input 
                        type="text" 
                        class="search-input" 
                        id="searchInput" 
                        placeholder="🔍 Search by keyword, concept, or meaning..."
                        oninput="filterNotes()"
                    >
                </div>

                <!-- Notes Container -->
                <div class="notes-container" id="notesContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // Default categories
        const DEFAULT_CATEGORIES = [
            'Automation',
            'Integration',
            'Reports',
            'Workflows',
            'Data Entry',
            'Reconciliation',
            'API',
            'Best Practice',
            'Troubleshooting'
        ];

        let notes = [];
        let categories = [];
        let currentFilter = 'All';
        let editingId = null;
        let pendingAction = null;

        // Initialize
        function init() {
            loadFromStorage();
            renderCategories();
            renderNotes();
            updateStats();
        }

        // Storage Functions
        function loadFromStorage() {
            const stored = localStorage.getItem('zoho-knowledge-base');
            const storedCategories = localStorage.getItem('zoho-categories');
            
            if (stored) {
                notes = JSON.parse(stored);
            }
            
            if (storedCategories) {
                categories = JSON.parse(storedCategories);
            } else {
                categories = [...DEFAULT_CATEGORIES];
                saveCategoriesToStorage();
            }
        }

        function saveToStorage() {
            localStorage.setItem('zoho-knowledge-base', JSON.stringify(notes));
        }

        function saveCategoriesToStorage() {
            localStorage.setItem('zoho-categories', JSON.stringify(categories));
        }

        // Category Management
        function renderCategories() {
            const list = document.getElementById('categoryList');
            list.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'category-btn active';
            allBtn.onclick = () => filterByCategory('All');
            allBtn.innerHTML = `<span>All Notes</span><span class="category-count">${notes.length}</span>`;
            list.appendChild(allBtn);

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                const count = notes.filter(n => n.category === cat).length;
                btn.onclick = () => filterByCategory(cat);
                btn.innerHTML = `<span>${cat}</span><span class="category-count">${count}</span>`;
                list.appendChild(btn);
            });

            updateCategorySelect();
        }

        function addNewCategory() {
            const input = document.getElementById('newCategoryInput');
            const newCat = input.value.trim();

            if (!newCat) {
                alert('Please enter a category name');
                return;
            }

            if (categories.includes(newCat)) {
                alert('Category already exists');
                return;
            }

            categories.push(newCat);
            categories.sort();
            saveCategoriesToStorage();
            renderCategories();
            input.value = '';
        }

        function updateCategorySelect() {
            const select = document.getElementById('noteCategory');
            select.innerHTML = '';
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        function filterByCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.category-btn').classList.add('active');
            
            // If selecting a specific category (not "All"), set it as default for new notes
            if (cat !== 'All') {
                document.getElementById('noteCategory').value = cat;
            }
            
            filterNotes();
        }

        // ============ SIMILARITY CALCULATION ============
        function calculateSimilarity(str1, str2) {
            const s1 = str1.toLowerCase().trim();
            const s2 = str2.toLowerCase().trim();
            
            if (s1 === s2) return 1;
            if (s1.length < 10 || s2.length < 10) return 0;
            
            // Split into words (even very short ones for better matching)
            const words1 = s1.split(/\s+/).filter(w => w.length > 1);
            const words2 = s2.split(/\s+/).filter(w => w.length > 1);
            
            if (words1.length === 0 || words2.length === 0) return 0;
            
            // Create sets for comparison
            const set1 = new Set(words1);
            const set2 = new Set(words2);
            
            // Count exact word matches
            const exactMatches = words1.filter(w => set2.has(w)).length;
            
            // Check for partial/stemmed matches (invoice/invoices, create/creating/created, etc)
            let partialMatches = 0;
            const stopWords = new Set(['a', 'an', 'the', 'in', 'on', 'at', 'to', 'be', 'is', 'can', 'will', 'this', 'this', 'or', 'and']);
            
            for (let w1 of words1) {
                if (stopWords.has(w1)) continue;
                
                for (let w2 of words2) {
                    if (stopWords.has(w2)) continue;
                    
                    // Check if words are similar (one contains the other or similar stems)
                    if (w1.includes(w2) || w2.includes(w1)) {
                        if (w1 !== w2) partialMatches++;
                        break;
                    }
                    
                    // Check for common word stems (invoice/invoicing, create/creating, etc)
                    if ((w1.length > 4 && w2.length > 4) && 
                        (w1.startsWith(w2.substring(0, 4)) || w2.startsWith(w1.substring(0, 4)))) {
                        partialMatches++;
                        break;
                    }
                }
            }
            
            // Calculate total meaningful words (exclude stop words)
            const meaningful1 = words1.filter(w => !stopWords.has(w)).length;
            const meaningful2 = words2.filter(w => !stopWords.has(w)).length;
            const totalMeaningful = Math.max(meaningful1, meaningful2);
            
            // Final score: combine exact + partial matches
            const totalMatches = exactMatches + partialMatches;
            const similarity = totalMatches / totalMeaningful;
            
            return Math.min(similarity, 1);
        }

        // ============ REAL-TIME DUPLICATE DETECTION ============
        function checkRealTimeDuplicates() {
            const text = document.getElementById('noteText').value.trim();
            const panel = document.getElementById('realtimePanel');

            if (text.length < 20) {
                panel.classList.remove('visible');
                document.getElementById('saveBtn').disabled = false;
                return;
            }

            // Find ALL similar notes (not just the most similar one)
            let similarNotes = [];

            for (let note of notes) {
                const similarity = calculateSimilarity(text, note.text);
                
                if (similarity >= 0.3) {
                    similarNotes.push({
                        note: note,
                        similarity: similarity
                    });
                }
            }

            // Sort by similarity (highest first)
            similarNotes.sort((a, b) => b.similarity - a.similarity);

            if (similarNotes.length > 0) {
                // Similar notes found
                let html = `
                    <div class="similar-note-alert">
                        <div class="real-time-status">⚠️ Similar Notes Found! (${similarNotes.length} match${similarNotes.length !== 1 ? 'es' : ''})</div>
                `;

                // Show all similar notes
                similarNotes.forEach((item, index) => {
                    html += `
                        <div class="old-note-preview" style="margin-bottom: 10px;">
                            <div class="old-note-label">📌 Note ${index + 1} - ${Math.round(item.similarity * 100)}% Match (Category: ${item.note.category})</div>
                            <div class="old-note-text">"${item.note.text.substring(0, 120)}${item.note.text.length > 120 ? '...' : ''}"</div>
                            <button class="btn-overwrite" onclick="handleOverwrite(${item.note.id})" style="margin-top: 8px; width: auto; padding: 6px 12px; font-size: 0.75em;">
                                ✏️ Overwrite This
                            </button>
                        </div>
                    `;
                });

                html += `
                        <button class="btn-continue" onclick="handleContinue()" style="margin-top: 10px; width: 100%; padding: 8px;">
                            ✓ Continue Saving New
                        </button>
                    </div>
                `;
                
                panel.innerHTML = html;
                panel.classList.add('visible');
                document.getElementById('saveBtn').disabled = true;
            } else {
                // No similar notes
                let html = `
                    <div class="unique-note-alert">
                        <strong>✓ This is unique!</strong> No similar notes found. You can save this as a new note.
                    </div>
                `;
                panel.innerHTML = html;
                panel.classList.add('visible');
                document.getElementById('saveBtn').disabled = false;
            }
        }

        function handleOverwrite(noteId) {
            pendingAction = { type: 'overwrite', noteId: noteId };
            saveNote();
        }

        function handleContinue() {
            pendingAction = { type: 'continue' };
            saveNote();
        }

        // ============ NOTE FUNCTIONS ============
        function toggleForm() {
            const form = document.getElementById('formSection');
            form.classList.toggle('visible');
            if (form.classList.contains('visible')) {
                document.getElementById('noteText').focus();
            } else {
                cancelEdit();
            }
        }

        function cancelEdit() {
            document.getElementById('noteText').value = '';
            document.getElementById('noteTitle').value = '';
            document.getElementById('realtimePanel').classList.remove('visible');
            document.getElementById('realtimePanel').innerHTML = '';
            document.getElementById('formSection').classList.remove('visible');
            document.getElementById('saveBtn').disabled = false;
            editingId = null;
            pendingAction = null;
        }

        async function improveGrammar(text) {
            // Client-side grammar improvements (no API needed)
            let improved = text.trim();
            
            // Capitalize first letter
            if (improved.length > 0) {
                improved = improved.charAt(0).toUpperCase() + improved.slice(1);
            }
            
            // Fix common grammar issues
            improved = improved
                // Fix spacing before punctuation
                .replace(/\s+([.,!?;:])/g, '$1')
                // Add space after punctuation if missing
                .replace(/([.,!?;:])([a-z])/g, '$1 $2')
                // Fix multiple spaces
                .replace(/\s+/g, ' ')
                // Fix "this will" to "This will"
                .replace(/\bthis\s+/gi, 'This ')
                // Fix "is" usage
                .replace(/\bcna\b/gi, 'can')
                .replace(/\bnad\b/gi, 'and')
                .replace(/\bfro\b/gi, 'for')
                .replace(/\biot\b/gi, 'not')
                .replace(/\bwil\b/gi, 'will')
                // Fix article usage
                .replace(/\ba\s+([aeiou])/gi, 'an $1')
                // Add period at end if missing and text is substantial
                .replace(/([a-z])$/i, '$1');
                
            if (improved.length > 20 && !improved.match(/[.!?]$/)) {
                improved += '.';
            }
            
            return improved;
        }

        async function saveNote() {
            let text = document.getElementById('noteText').value.trim();
            const title = document.getElementById('noteTitle').value.trim();
            const category = document.getElementById('noteCategory').value;

            if (!text) {
                alert('Please enter note content');
                return;
            }

            // Fix grammar
            const improvedText = await improveGrammar(text);

            if (pendingAction) {
                if (pendingAction.type === 'overwrite') {
                    // OVERWRITE: Replace old note completely
                    const noteIndex = notes.findIndex(n => n.id === pendingAction.noteId);
                    if (noteIndex !== -1) {
                        notes[noteIndex].text = improvedText;
                        notes[noteIndex].title = title || improvedText.substring(0, 50) + '...';
                        notes[noteIndex].category = category;
                        notes[noteIndex].updatedAt = new Date().toISOString();
                    }
                    
                    saveToStorage();
                    renderNotes();
                    updateStats();
                    renderCategories();
                    cancelEdit();
                    alert('✓ Old note overwritten with improved version!');
                } else if (pendingAction.type === 'continue') {
                    // CONTINUE: Save as new separate note
                    finalSaveNote(improvedText, title, category);
                }
            } else {
                // Check for duplicates in normal save
                let mostSimilar = null;
                let highestScore = 0;

                for (let note of notes) {
                    const similarity = calculateSimilarity(improvedText, note.text);
                    
                    if (similarity > highestScore) {
                        highestScore = similarity;
                        mostSimilar = note;
                    }
                }

                if (highestScore > 0.3 && mostSimilar) {
                    // Ask user what to do
                    if (confirm(`Similar note found (${Math.round(highestScore * 100)}% match)!\n\nExisting: "${mostSimilar.text.substring(0, 80)}..."\n\nClick OK to Overwrite the old note, or Cancel to save as new.`)) {
                        // Overwrite
                        mostSimilar.text = improvedText;
                        mostSimilar.title = title || improvedText.substring(0, 50) + '...';
                        mostSimilar.category = category;
                        mostSimilar.updatedAt = new Date().toISOString();
                        saveToStorage();
                        renderNotes();
                        updateStats();
                        renderCategories();
                        cancelEdit();
                    } else {
                        // Continue as new
                        finalSaveNote(improvedText, title, category);
                    }
                } else {
                    // Normal save (no duplicates detected)
                    finalSaveNote(improvedText, title, category);
                }
            }
        }

        function finalSaveNote(text, title, category) {
            if (editingId) {
                const note = notes.find(n => n.id === editingId);
                if (note) {
                    note.text = text;
                    note.title = title || text.substring(0, 50) + '...';
                    note.category = category;
                    note.updatedAt = new Date().toISOString();
                }
            } else {
                const note = {
                    id: Date.now(),
                    title: title || text.substring(0, 50) + '...',
                    text: text,
                    category: category,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                notes.unshift(note);
            }

            saveToStorage();
            renderNotes();
            updateStats();
            renderCategories();
            cancelEdit();
        }

        function deleteNote(id) {
            if (confirm('Are you sure you want to delete this note?')) {
                notes = notes.filter(n => n.id !== id);
                saveToStorage();
                renderNotes();
                updateStats();
                renderCategories();
            }
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                editingId = id;
                document.getElementById('noteText').value = note.text;
                document.getElementById('noteTitle').value = note.title;
                document.getElementById('noteCategory').value = note.category;
                document.getElementById('formSection').classList.add('visible');
                document.getElementById('noteText').focus();
                checkRealTimeDuplicates();
                
                // Reset filter to "All" so user can see they're editing
                currentFilter = 'All';
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelectorAll('.category-btn')[0].classList.add('active');
            }
        }

        // ============ SEMANTIC SEARCH ============
        function semanticSearch(query) {
            if (!query.trim()) {
                return notes;
            }

            const queryWords = query.toLowerCase().split(/\s+/).filter(w => w.length > 2);
            
            return notes.filter(note => {
                const noteText = note.text.toLowerCase();
                const noteTitle = note.title.toLowerCase();

                if (noteText.includes(query.toLowerCase()) || noteTitle.includes(query.toLowerCase())) {
                    return true;
                }

                const matchCount = queryWords.filter(word => 
                    noteText.includes(word) || noteTitle.includes(word)
                ).length;

                return matchCount > 0;
            });
        }

        function filterNotes() {
            const search = document.getElementById('searchInput').value;
            const filtered = semanticSearch(search).filter(note => {
                const matchesCategory = currentFilter === 'All' || note.category === currentFilter;
                return matchesCategory;
            });

            renderNotesFromArray(filtered);
        }

        function renderNotes() {
            filterNotes();
        }

        function renderNotesFromArray(notesToRender) {
            const container = document.getElementById('notesContainer');
            
            if (notesToRender.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No notes found</h3>
                        <p>${notes.length === 0 ? 'Start adding notes to build your Zoho knowledge base!' : 'Try different search terms or category'}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = notesToRender.map(note => `
                <div class="note-card" data-id="${note.id}">
                    <div class="note-header">
                        <div>
                            <span class="note-category">${note.category}</span>
                        </div>
                        <div class="note-actions">
                            <button class="btn-small btn-edit" onclick="editNote(${note.id})">Edit</button>
                            <button class="btn-small btn-delete" onclick="deleteNote(${note.id})">Delete</button>
                        </div>
                    </div>
                    <div class="note-text">${note.text}</div>
                    <div class="note-meta">
                        <span>📝 ${note.title}</span>
                        <span>📅 ${new Date(note.createdAt).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalNotes').textContent = notes.length;
            document.getElementById('totalCategories').textContent = categories.length;
        }

        function exportToPDF() {
            // Group notes by category
            const notesByCategory = {};
            categories.forEach(cat => {
                notesByCategory[cat] = notes.filter(n => n.category === cat);
            });

            // Create HTML content for PDF
            let htmlContent = `
                <div style="font-family: Arial, sans-serif; color: #333;">
                    <h1 style="text-align: center; color: #0066cc; border-bottom: 3px solid #0066cc; padding-bottom: 10px; margin-bottom: 30px;">📚 Zoho Knowledge Base</h1>
                    
                    <div style="text-align: center; color: #666; font-size: 12px; margin-bottom: 20px;">
                        Exported on: ${new Date().toLocaleString()}
                    </div>
                    
                    <div style="background-color: #f0f8ff; border: 1px solid #0066cc; border-radius: 5px; padding: 15px; margin-bottom: 30px;">
                        <h3 style="margin-top: 0; color: #0066cc;">Summary</h3>
                        <div style="margin: 8px 0; font-size: 13px;"><strong>Total Notes:</strong> ${notes.length}</div>
                        <div style="margin: 8px 0; font-size: 13px;"><strong>Categories:</strong> ${categories.length}</div>
                        <div style="margin: 8px 0; font-size: 13px;"><strong>Export Date:</strong> ${new Date().toLocaleDateString()}</div>
                    </div>
            `;

            // Add categories and their notes
            categories.forEach(category => {
                const categoryNotes = notesByCategory[category];
                const noteCount = categoryNotes.length;
                
                htmlContent += `
                    <h2 style="color: #0066cc; background-color: #e6f0ff; padding: 10px 15px; border-left: 4px solid #0066cc; margin-top: 30px; margin-bottom: 15px;">
                        ${category} <span style="font-size: 12px; color: #666; margin-left: 10px;">(${noteCount} pointer${noteCount !== 1 ? 's' : ''})</span>
                    </h2>
                `;

                if (categoryNotes.length === 0) {
                    htmlContent += `<div style="color: #999; font-style: italic; padding: 10px;">No notes in this category</div>`;
                } else {
                    categoryNotes.forEach((note, index) => {
                        const dateStr = new Date(note.createdAt).toLocaleDateString();
                        htmlContent += `
                            <div style="background-color: #f9f9f9; border: 1px solid #ddd; border-left: 4px solid #0066cc; padding: 12px 15px; margin-bottom: 12px;">
                                <div style="font-size: 14px; margin-bottom: 8px; color: #222;">${index + 1}. ${note.text}</div>
                                <div style="font-size: 11px; color: #999; border-top: 1px solid #eee; padding-top: 6px; margin-top: 6px;">
                                    <strong>Title:</strong> ${note.title} | <strong>Date:</strong> ${dateStr}
                                </div>
                            </div>
                        `;
                    });
                }
            });

            htmlContent += `
                    <hr style="margin-top: 40px; border: none; border-top: 2px solid #0066cc;">
                    <p style="text-align: center; color: #999; font-size: 11px; margin-top: 20px;">
                        Generated by Zoho Knowledge Manager
                    </p>
                </div>
            `;

            // Create PDF using html2pdf
            const element = document.createElement('div');
            element.innerHTML = htmlContent;
            
            const opt = {
                margin: 10,
                filename: `zoho-knowledge-${new Date().toISOString().split('T')[0]}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };

            // Generate and download PDF
            html2pdf().set(opt).from(element).save();
            
            // Show success message
            alert('✓ PDF exported successfully!');
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>
</html>
